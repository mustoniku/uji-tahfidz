<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#075e3b">
  <title>Uji Tahfidz Madrasah</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf6f1;font-family:Arial,sans-serif}.appFrame{display:block;width:100%;height:100%;border:0;background:#edf6f1}.loader{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 80% 10%,rgba(218,174,46,.2),transparent 30%),linear-gradient(145deg,#eaf6ef,#fffaf0);transition:opacity .45s ease,visibility .45s ease}.loader.done{opacity:0;visibility:hidden}.card{width:min(480px,100%);padding:31px;border-radius:27px;text-align:center;background:rgba(255,255,255,.95);border:1px solid #d8e8df;border-top:6px solid #d6a928;box-shadow:0 24px 70px rgba(5,73,48,.18)}.card img{width:82px;height:82px;object-fit:contain;filter:drop-shadow(0 8px 13px rgba(0,45,28,.18))}.card h1{margin:16px 0 7px;color:#075e3b;font-size:26px}.card p{margin:0;color:#61766d;line-height:1.6}.bar{height:9px;margin:24px 0 14px;border-radius:99px;background:#dcebe3;overflow:hidden}.bar span{display:block;width:38%;height:100%;border-radius:99px;background:linear-gradient(90deg,#075e3b,#d6a928,#1689a7);animation:move 1.1s ease-in-out infinite}.status{font-size:13px;font-weight:800;color:#075e3b}@keyframes move{from{transform:translateX(-120%)}to{transform:translateX(350%)}}
  </style>
</head>
<body>
  <div id="loader" class="loader"><main class="card"><img src="https://cms2023.kemenag.go.id/storage/files/shares/Logo/Kementerian_Agama_new_logo%20(2).png" alt="Logo Kementerian Agama"><h1>Uji Tahfidz Madrasah</h1><p>Kantor Kementerian Agama Kabupaten Tegal</p><div class="bar"><span></span></div><div class="status">Menyiapkan layanan Uji Tahfidz…</div></main></div>
  <iframe class="appFrame" title="Aplikasi Uji Tahfidz Madrasah" allow="clipboard-write" src="https://script.google.com/macros/s/AKfycby95tBs9fsL1kwaISotuut7_XC1GHiHoSy6xQ5rMjkGWionenKlE4Kt1zvA4TEuqkbG/exec" onload="document.getElementById('loader').classList.add('done')"></iframe>
</body>
</html>
