<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#075e3b">
  <title>Uji Tahfidz Madrasah</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Arial,sans-serif;color:#123c2d;background:radial-gradient(circle at 80% 10%,rgba(218,174,46,.2),transparent 30%),linear-gradient(145deg,#eaf6ef,#fffaf0)}
    .card{width:min(520px,100%);padding:34px;border-radius:28px;text-align:center;background:rgba(255,255,255,.94);border:1px solid #d8e8df;border-top:6px solid #d6a928;box-shadow:0 24px 70px rgba(5,73,48,.18)}
    img{width:86px;height:86px;object-fit:contain;filter:drop-shadow(0 8px 13px rgba(0,45,28,.18))}h1{margin:17px 0 7px;color:#075e3b;font-size:27px}p{margin:0;color:#61766d;line-height:1.6}.bar{height:9px;margin:25px 0 15px;border-radius:99px;background:#dcebe3;overflow:hidden}.bar span{display:block;width:38%;height:100%;border-radius:99px;background:linear-gradient(90deg,#075e3b,#d6a928,#1689a7);animation:move 1.1s ease-in-out infinite}.status{font-size:13px;font-weight:800;color:#075e3b}.btn{display:inline-block;margin-top:20px;padding:12px 19px;border-radius:12px;background:#075e3b;color:#fff;text-decoration:none;font-weight:800}@keyframes move{from{transform:translateX(-120%)}to{transform:translateX(350%)}}
  </style>
</head>
<body>
  <main class="card">
    <img src="https://cms2023.kemenag.go.id/storage/files/shares/Logo/Kementerian_Agama_new_logo%20(2).png" alt="Logo Kementerian Agama">
    <h1>Uji Tahfidz Madrasah</h1>
    <p>Kantor Kementerian Agama Kabupaten Tegal</p>
    <div class="bar"><span></span></div>
    <div class="status">Menghubungkan ke layanan Uji Tahfidz…</div>
    <a class="btn" href="https://script.google.com/macros/s/AKfycby95tBs9fsL1kwaISotuut7_XC1GHiHoSy6xQ5rMjkGWionenKlE4Kt1zvA4TEuqkbG/exec">Buka Aplikasi</a>
  </main>
  <script>setTimeout(()=>location.replace('https://script.google.com/macros/s/AKfycby95tBs9fsL1kwaISotuut7_XC1GHiHoSy6xQ5rMjkGWionenKlE4Kt1zvA4TEuqkbG/exec'),1200)</script>
</body>
</html>
